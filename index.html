<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaptoPilot</title>
    <!--
      CSP is declared here as well as in public/_headers on purpose. The _headers
      file is Cloudflare Pages edge config only, so without this meta tag the
      Electron build (which loads dist/ over file:// and holds the user's API key
      in localStorage) would run with no CSP at all.

      Kept in sync with public/_headers. 'unsafe-inline' in style-src is required:
      ChatInterface sets an inline animationDelay style attribute.

      frame-ancestors is deliberately omitted: browsers ignore it inside a <meta>
      tag and log a console error. Clickjacking is still covered on both targets
      (X-Frame-Options here, plus frame-ancestors in the _headers file).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com; base-uri 'none'; form-action 'none'"
    />
    <!--
      The Google AI Studio importmap that used to sit here (react + @google/genai
      from aistudiocdn.com) is deliberately removed. Vite resolves and bundles
      both from node_modules, so the mapping was dead - and because importmaps
      support no SRI, a floating ^ range (19.1.1 -> 19.3.0) would have meant
      silently executing unreviewed code if it ever became active.
    -->
  </head>
  <body class="bg-slate-900 text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
